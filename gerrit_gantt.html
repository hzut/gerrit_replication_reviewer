        x: [t.dur * 1000],
        y: [`#${String(t.id).padStart(2, "0")} ${t.repo}`],

        showlegend: idx === 0 || idx === 1,
        marker: { color: isLong ? "#ef4444" : "#3b82f6" },

    });

    Plotly.newPlot("chart", traces, {
